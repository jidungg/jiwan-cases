<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family='"Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif'>
<defs>
  <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#1a1a1a"/></marker>
  <marker id="arg" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#8a8a8a"/></marker>
</defs>
<rect width="1000" height="600" fill="#ffffff"/>

<!-- ================= 좌측: 접속 → 배정 → 소속 ================= -->
<rect x="24" y="44" width="266" height="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3" rx="4"/>
<text x="157" y="69" font-size="13.5" text-anchor="middle" fill="#1a1a1a">플레이어 접속</text>

<line x1="157" y1="84" x2="157" y2="110" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ar)"/>

<rect x="24" y="116" width="266" height="58" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="1.3" rx="4"/>
<text x="157" y="137" font-size="12.5" text-anchor="middle" fill="#1a1a1a" font-weight="700">ADogongRunGameMode::PostLogin</text>
<text x="157" y="156" font-size="12" text-anchor="middle" fill="#4a4a4a">빈 기지 슬롯(0~3) 배정 · 서버 권위</text>

<line x1="157" y1="174" x2="157" y2="200" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ar)"/>

<rect x="24" y="206" width="266" height="76" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="1.3" rx="4"/>
<text x="157" y="227" font-size="12.5" text-anchor="middle" fill="#1a1a1a" font-weight="700">ADogongPlayerState</text>
<text x="157" y="247" font-size="12" text-anchor="middle" fill="#4a4a4a">AssignedBaseCampIndex</text>
<text x="157" y="266" font-size="12" text-anchor="middle" fill="#4a4a4a">CurrentRegion = RegionId (정본)</text>

<!-- ================= 좌측: 스트리밍 서브시스템 ================= -->
<rect x="24" y="330" width="266" height="86" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="1.3" rx="4"/>
<text x="157" y="352" font-size="12.5" text-anchor="middle" fill="#1a1a1a" font-weight="700">UDogongRegionStreamingSubsystem</text>
<text x="157" y="372" font-size="12" text-anchor="middle" fill="#4a4a4a">진입 = 로드 (refcount++)</text>
<text x="157" y="391" font-size="12" text-anchor="middle" fill="#4a4a4a">마지막 이탈 = 언로드</text>
<text x="157" y="408" font-size="12" text-anchor="middle" fill="#4a4a4a">= 다음 진입 시 리셋</text>

<!-- ================= 좌측: 렐러번시 게이트 ================= -->
<rect x="24" y="466" width="266" height="90" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="1.3" rx="4"/>
<text x="157" y="488" font-size="12.5" text-anchor="middle" fill="#1a1a1a" font-weight="700">넷 렐러번시 게이트</text>
<text x="157" y="508" font-size="12" text-anchor="middle" fill="#4a4a4a">IsNetRelevantFor 오버라이드</text>
<text x="157" y="527" font-size="12" text-anchor="middle" fill="#4a4a4a">RegionId 다르면 컬링</text>
<text x="157" y="545" font-size="12" text-anchor="middle" fill="#4a4a4a">= 개인 기지 소프트 격리</text>

<!-- ================= 우측: 단일 월드 ================= -->
<rect x="320" y="44" width="656" height="512" fill="none" stroke="#1a1a1a" stroke-width="1.6" rx="5"/>
<text x="340" y="70" font-size="13.5" fill="#1a1a1a" font-weight="700">World.umap · 퍼시스턴트 단일 월드</text>
<text x="340" y="90" font-size="12" fill="#6a6a6a">퍼시스턴트 레벨 + 서브레벨 스트리밍. travel 없음 — 모든 이동이 좌표 이동.</text>

<!-- 기지 그룹 -->
<rect x="344" y="110" width="608" height="180" fill="none" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="4 3" rx="4"/>
<text x="360" y="132" font-size="12.5" fill="#1a1a1a" font-weight="700">기지 4채 · 상시 로드</text>
<text x="360" y="151" font-size="11.5" fill="#6a6a6a">ALevelInstance 4개 배치 ← BaseCamp.umap 원본 1개</text>

<rect x="360" y="176" width="134" height="76" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2" rx="3"/>
<text x="427" y="205" font-size="12.5" text-anchor="middle" fill="#1a1a1a">기지 슬롯 0</text>
<text x="427" y="226" font-size="11.5" text-anchor="middle" fill="#6a6a6a">Region.Base.00</text>

<rect x="508" y="176" width="134" height="76" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2" rx="3"/>
<text x="575" y="205" font-size="12.5" text-anchor="middle" fill="#1a1a1a">기지 슬롯 1</text>
<text x="575" y="226" font-size="11.5" text-anchor="middle" fill="#6a6a6a">Region.Base.01</text>

<rect x="656" y="176" width="134" height="76" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2" rx="3"/>
<text x="723" y="205" font-size="12.5" text-anchor="middle" fill="#1a1a1a">기지 슬롯 2</text>
<text x="723" y="226" font-size="11.5" text-anchor="middle" fill="#6a6a6a">Region.Base.02</text>

<rect x="804" y="176" width="134" height="76" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2" rx="3"/>
<text x="871" y="205" font-size="12.5" text-anchor="middle" fill="#1a1a1a">기지 슬롯 3</text>
<text x="871" y="226" font-size="11.5" text-anchor="middle" fill="#6a6a6a">Region.Base.03</text>

<text x="360" y="273" font-size="11.5" fill="#6a6a6a">좌표를 넓게 벌려 배치 — 격리용이 아니라 콜리전·내브메시 정합성용.</text>

<!-- 약탈 그룹 -->
<rect x="344" y="320" width="608" height="210" fill="none" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="4 3" rx="4"/>
<text x="360" y="342" font-size="12.5" fill="#1a1a1a" font-weight="700">약탈 지역 6~7개 · 온디맨드 스트리밍</text>
<text x="360" y="361" font-size="11.5" fill="#6a6a6a">ULevelStreamingDynamic · 서버·클라 동일한 인스턴스 이름으로 생성</text>

<rect x="360" y="386" width="180" height="82" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2" rx="3"/>
<text x="450" y="414" font-size="12.5" text-anchor="middle" fill="#1a1a1a">Region.Raid.01</text>
<text x="450" y="434" font-size="11.5" text-anchor="middle" fill="#6a6a6a">Region1.umap</text>
<text x="450" y="453" font-size="11.5" text-anchor="middle" fill="#4a4a4a">refcount 2</text>

<rect x="560" y="386" width="180" height="82" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2" rx="3"/>
<text x="650" y="414" font-size="12.5" text-anchor="middle" fill="#1a1a1a">Region.Raid.02</text>
<text x="650" y="434" font-size="11.5" text-anchor="middle" fill="#6a6a6a">Region2.umap</text>
<text x="650" y="453" font-size="11.5" text-anchor="middle" fill="#4a4a4a">refcount 1</text>

<rect x="760" y="386" width="180" height="82" fill="#fafafa" stroke="#b4b4b4" stroke-width="1.2" stroke-dasharray="4 3" rx="3"/>
<text x="850" y="414" font-size="12.5" text-anchor="middle" fill="#8a8a8a">Region.Raid.03 …</text>
<text x="850" y="434" font-size="11.5" text-anchor="middle" fill="#8a8a8a">미로드</text>
<text x="850" y="453" font-size="11.5" text-anchor="middle" fill="#8a8a8a">refcount 0</text>

<text x="360" y="500" font-size="11.5" fill="#6a6a6a">언로드 경계 = 리셋 경계. 완전히 비워져 언로드되면 다음 진입은 새 인스턴스 —</text>
<text x="360" y="517" font-size="11.5" fill="#6a6a6a">루트·적이 초기 상태. 점유 중이면 리셋되지 않아 뒤따라 온 친구가 같은 루트를 본다.</text>

<!-- ================= 연결선 ================= -->
<path d="M290,244 H310 V200 H344" fill="none" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arg)"/>
<text x="299" y="192" font-size="11" fill="#6a6a6a">배정된 기지</text>

<path d="M290,373 H344" fill="none" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="5 3"/>
<path d="M330,373 V427 H360" fill="none" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arg)"/>
<text x="299" y="365" font-size="11" fill="#6a6a6a">로드 / 언로드</text>

<path d="M290,511 H312 V300 H320" fill="none" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arg)"/>
<text x="299" y="292" font-size="11" fill="#6a6a6a">시야 격리</text>
</svg>
